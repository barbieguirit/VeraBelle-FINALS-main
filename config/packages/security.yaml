security:
    password_hashers:
        App\Entity\User:
            algorithm: auto
    
    # Role hierarchy - Admin inherits all staff permissions
    role_hierarchy:
        ROLE_ADMIN: ROLE_STAFF
    
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
                
        api_platform:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginAuthenticator
            user_checker: App\Security\UserChecker
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

    access_control:
        # Public areas (must be first)
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }

        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED }
        
        # Admin only areas
        - { path: ^/admin/users, roles: ROLE_ADMIN }
        - { path: ^/admin/activity-logs, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        
        # Profile (accessible by all authenticated users)
        - { path: ^/profile, roles: ROLE_STAFF }
        
        # All CRUD pages require at least ROLE_STAFF
        - { path: ^/product, roles: ROLE_STAFF }
        - { path: ^/category, roles: ROLE_STAFF }
        - { path: ^/stock, roles: ROLE_STAFF }
        - { path: ^/order, roles: ROLE_STAFF }
        - { path: ^/customer, roles: ROLE_STAFF }
        - { path: ^/payment, roles: ROLE_STAFF }
        
        # Fallback - all other pages require authentication
        - { path: ^/, roles: ROLE_STAFF }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
